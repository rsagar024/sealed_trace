name: sealed_trace_example
description: "Demonstrates the sealed_trace logging SDK against a live server: levels, masking, user and device context, flush and diagnostics."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  sealed_trace:
    path: ..
  device_info_plus: ^13.3.0

dev_dependencies:
  dio: ^5.11.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate the app icons with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  adaptive_icon_background: "#1a202c"
  adaptive_icon_foreground: assets/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1a202c"
    theme_color: "#1a202c"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
