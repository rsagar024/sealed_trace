name: sealed_trace_example
description: "Demonstrates the sealed_trace logging SDK against a live server: levels, masking, user and device context, flush and diagnostics."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  sealed_trace:
    path: ..
  device_info_plus: ^13.3.0

dev_dependencies:
  dio: ^5.11.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
