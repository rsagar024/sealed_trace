name: sealed_trace_example
description: "Demonstrates the sealed_trace logging SDK: levels, masking, Dio, flush, clear and diagnostics."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  sealed_trace:
    path: ..
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
