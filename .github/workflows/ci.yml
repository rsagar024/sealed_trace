# CI for sealed_trace (I1).
#
# The crypto (AES-256, GCM, RSA-OAEP, DER) is implemented in Dart and has not
# been audited, so every change runs the full suite and the cross-implementation
# checks: the committed envelope vectors are decrypted by Node's own crypto
# (OpenSSL), with no Dart code involved.
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib

      - name: Analyze
        run: flutter analyze

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Coverage gate (core >= 90%)
        run: dart run tool/coverage/check_coverage.dart coverage/lcov.info

      - name: Cross-check envelope vectors with Node/OpenSSL
        run: node tool/generate_vectors/verify_vectors.js
